<!-- learning tables "<table></table> creates a tables","<tr></tr>, creates a table row ",<th></th> create tables heading,"<td></td>  table data that hold the data inside table"// -->
<html>
    <head>
        <title>student details</title>
    </head>
    <body>
        <table border="1" cellpadding="10" cellspacing="10">
            <!-- cellpadding creates space under table,cellspacing create space between rows and colums -->
            <tr>
                <!-- <tr> table row that create a row -->
                <th>Name</th>
                <!-- <th></th> crete a header inside table  -->
                <th>Course</th>
                <th>year</th>
            </tr>
            <tr>
                <td>imran</td> 
                <!-- td hold the table data inside row -->
                <td>BCA</td>
                <td>3</td>
            </tr>
        </table>
    </body>
</html>
